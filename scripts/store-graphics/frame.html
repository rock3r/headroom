<!doctype html>
<!--
  One template for every Play Store graphic. render.sh opens it in headless Chrome with a query
  string that picks the kind of graphic and its content, and screenshots the window.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Google Sans Flex";
    src: url("../../core/designsystem/src/main/res/font/google_sans_flex.ttf");
    font-weight: 100 1000;
  }
  :root {
    --brand: #3553B0;
    --deep: #14204F;
    --ink: #0B1233;
    --pink: #F9C5E4;
    --sky: #C9DCFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Google Sans Flex", sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 85% 8%, rgba(249, 197, 228, .28), transparent 38%),
      radial-gradient(circle at 0% 100%, rgba(201, 220, 255, .22), transparent 45%),
      linear-gradient(160deg, var(--brand) 0%, var(--deep) 78%);
    position: relative;
  }
  /* The icon's ring, large and faint, as a backdrop motif. */
  .ring {
    position: absolute; border-radius: 50%;
    border: 70px solid rgba(255, 255, 255, .07);
    border-left-color: rgba(255, 255, 255, .025);
  }
  .shot {
    position: absolute; overflow: hidden;
    border-radius: 56px;
    border: 14px solid #0A0F24;
    background: #0A0F24;
    box-shadow: 0 40px 90px rgba(5, 10, 35, .55), 0 0 0 2px rgba(255,255,255,.12);
  }
  .shot img { display: block; width: 100%; }
  h1 {
    font-weight: 760; letter-spacing: -0.02em; line-height: 1.02;
    font-variation-settings: "ROND" 100;
  }
  .sub { color: var(--sky); font-weight: 450; line-height: 1.3; }
  .pill {
    display: inline-block; background: var(--pink); color: var(--ink);
    font-weight: 650; border-radius: 999px;
  }

  /* Phone screenshot, 1080 x 1920. */
  .phone h1 { position: absolute; left: 84px; right: 84px; top: 110px; font-size: 92px; }
  .phone .sub { position: absolute; left: 86px; right: 120px; top: 330px; font-size: 40px; }
  .phone .shot { left: 150px; right: 150px; top: 500px; height: 1560px; }

  /* Widgets screenshot. */
  .widgets .grid {
    position: absolute; left: 70px; right: 70px; top: 500px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 34px;
  }
  .widgets .grid img { width: 100%; display: block; border-radius: 44px;
    box-shadow: 0 24px 60px rgba(5, 10, 35, .45); }
  .widgets .grid .wide { grid-column: span 2; }

  /* Tablet screenshot, 16:9 landscape. Sized in vw so the 7" and 10" renders match. */
  .tablet h1 { position: absolute; left: 5.8vw; top: 4.4vw; font-size: 4.6vw; }
  .tablet .sub { position: absolute; left: 5.9vw; top: 10.4vw; font-size: 2vw; }
  .tablet .shot { left: 8.5vw; right: 8.5vw; top: 15.5vw; height: 60vw;
    border-radius: 2.2vw; border-width: 0.75vw; }

  /* Feature graphic, 1024 x 500. */
  .feature .logo { position: absolute; left: 64px; top: 92px; width: 120px; height: 120px;
    border-radius: 34px; background: var(--brand); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .feature h1 { position: absolute; left: 64px; top: 236px; font-size: 84px; }
  .feature .sub { position: absolute; left: 66px; top: 340px; width: 470px; font-size: 30px; }
  .feature .shot { width: 250px; border-radius: 30px; border-width: 8px; }

  /* App icon, 512 x 512. */
  .icon { background: var(--brand); }
  .icon svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get("kind");
  const shots = "../../docs/screenshots/";
  document.body.className = kind;
  const html = (s) => { document.body.insertAdjacentHTML("beforeend", s); };
  const ring = (size, x, y) =>
    html(`<div class="ring" style="width:${size}px;height:${size}px;left:${x}px;top:${y}px"></div>`);
  const iconSvg = `<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M31,54 A23,23 0 0,1 54,31" stroke="#fff" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
      <path d="M54,31 A23,23 0 1,1 31,54" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <path fill="#fff" d="M54,47 A7,7 0 1,1 54,61 A7,7 0 1,1 54,47 Z"/></svg>`;

  if (kind === "icon") {
    html(iconSvg);
  } else if (kind === "feature") {
    ring(560, 560, -140);
    html(`<div class="logo">${iconSvg}</div>
      <h1>Headroom</h1>
      <p class="sub">How much of your AI subscriptions is left, at a glance.</p>
      <div class="shot" style="left:560px;top:70px;transform:rotate(-7deg)"><img src="${shots}overview.png"></div>
      <div class="shot" style="left:760px;top:40px;transform:rotate(6deg)"><img src="${shots}detail.png"></div>`);
  } else if (kind === "widgets") {
    ring(900, 420, -260);
    html(`<h1 style="position:absolute;left:84px;right:84px;top:110px;font-size:92px">${q.get("title")}</h1>
      <p class="sub" style="position:absolute;left:86px;right:120px;top:330px;font-size:40px">${q.get("sub")}</p>
      <div class="grid">
        <img src="${shots}widgets/widget-rings.png">
        <img src="${shots}widgets/widget-shape.png">
        <img class="wide" src="${shots}widgets/widget-bars.png">
        <img class="wide" src="${shots}widgets/widget-lock-screen.png">
      </div>`);
  } else {
    ring(kind === "tablet" ? 1100 : 900, kind === "tablet" ? 1500 : 420, -260);
    const offset = q.get("offset") || "0";
    html(`<h1>${q.get("title")}</h1><p class="sub">${q.get("sub")}</p>
      <div class="shot"><img src="${shots}${q.get("shot")}" style="margin-top:-${offset}px"></div>`);
  }
</script>
</body>
</html>
