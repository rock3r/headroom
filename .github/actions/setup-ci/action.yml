name: Set up CI
description: >
  JDK 21, the Android SDK, and Gradle. Check out the repository first; a local composite
  action cannot be loaded until the files are on the runner.

inputs:
  gradle-encryption-key:
    description: >
      Gradle configuration-cache encryption key. Empty is fine: the job still passes, and
      setup-gradle just skips storing the configuration cache.
    required: false
    default: ""
  android-packages:
    description: Android SDK packages to install
    required: false
    default: "platforms;android-37.0 build-tools;37.0.0"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ${{ inputs.android-packages }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}

    - name: Export Android SDK location
      shell: bash
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk" ]; then
          echo "ANDROID_HOME is not set after setup-android"
          exit 1
        fi
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
