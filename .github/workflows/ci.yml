name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Docs-only changes still run static analysis so the checks report. Tests and e2e skip.
      # `every` is required: the default `some` treats `**` as a match and ignores the exclusions.
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            tests:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!LICENSE"

  static-analysis:
    name: Static analysis (lint, detekt, ktfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run static analysis
        run: |
          scripts/ci-resources.sh 30 &
          resources=$!
          trap 'kill "$resources"' EXIT
          ./gradlew check -x test -x testDebugUnitTest -x allTests --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  unit-tests:
    name: Unit tests (libraries)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run library unit tests
        run: |
          scripts/ci-resources.sh 30 &
          resources=$!
          trap 'kill "$resources"' EXIT
          ./gradlew test jvmTest -x :app:test -x :app:testDebugUnitTest --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: library-unit-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios-tests:
    name: Unit tests (iOS simulator)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The shared modules' commonTest sources, run on Kotlin/Native. Only macOS can build them.
      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios-app:
    name: iOS app (build and tests)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install XcodeGen
        run: brew install xcodegen

      # Xcode's build phase builds HeadroomKit with Gradle, then the app and its tests run.
      - name: Build and test the iOS app
        run: iosApp/scripts/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-app-test-results
          path: iosApp/build/Logs/Test/
          retention-days: 7

  app-unit-tests:
    name: App unit tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Partition of every :app unit test. Filters live in build-logic (headroom.appTestShard).
        shard: [redeem-screenshots, screenshots, unit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run app unit tests
        run: |
          scripts/ci-resources.sh 30 &
          resources=$!
          trap 'kill "$resources"' EXIT
          ./gradlew :app:test -Pheadroom.appTestShard=${{ matrix.shard }} --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-unit-test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end tests (emulator, fake data)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # System image plus emulator binary, not the AVD. Gradle managed devices recreate the AVD
      # and leave lock files, so a snapshot restore is not clean. These two packages are the
      # minutes of sdkmanager download.
      - name: Restore emulator and API 37 system image
        id: gmd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-37
            ${{ env.ANDROID_HOME }}/system-images/android-37.0
          key: gmd-api37-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            gmd-api37-${{ runner.os }}-${{ runner.arch }}-

      - name: Run end-to-end tests on a managed device
        run: >
          ./gradlew :app:pixel9api37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Save emulator and API 37 system image
        if: always() && steps.gmd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-37
            ${{ env.ANDROID_HOME }}/system-images/android-37.0
          key: gmd-api37-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/build.gradle.kts') }}

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-reports
          path: app/build/outputs/androidTest-results/
          retention-days: 7
